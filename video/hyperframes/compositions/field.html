<!doctype html><html><head><meta charset="UTF-8"></head><body><template><link rel="stylesheet" href="style.css"><style>#root{position:absolute;inset:0;width:100%;height:100%}</style><div id="root" data-composition-id="field" data-width="1920" data-height="1080" data-duration="5"><div class="canvas"><div class="label top orange">03 / PROTECTION IS TEMPORARY</div><div class="top-right">DEVELOPMENT CAPTURE</div><h1 class="headline" id="field-title" style="position:absolute;left:90px;top:264px;font-size:164px"><span class="step-line">THE LIGHTS</span><span class="step-line orange">WON'T LAST.</span></h1><div id="field-bars" style="position:absolute;left:90px;top:658px;display:flex;gap:16px"><i style="display:block;width:118px;height:36px;background:#fa743d"></i><i style="display:block;width:118px;height:36px;background:#fa743d"></i><i style="display:block;width:118px;height:36px;background:#fa743d"></i><i style="display:block;width:118px;height:36px;background:#fa743d"></i></div><div class="meta orange" style="position:absolute;left:90px;top:730px">SUPPRESSION FIELD / FAILING</div><div class="photo" id="field-photo" style="left:760px;top:196px;width:1070px;height:669px"><img src="assets/suppression.png" alt="Suppression failure warning in current game"></div><div class="footer" id="field-ko">억제장치가 꺼지기 전에, 살아서 돌아오세요.</div><div class="progress" id="field-progress"></div></div></div><script>const tl=gsap.timeline({paused:true});tl.fromTo('#field-title',{x:-90,opacity:0},{x:0,opacity:1,duration:.4,ease:'expo.out'},.05);tl.fromTo('#field-photo',{scale:1.05,opacity:0},{scale:1,opacity:1,duration:.6,ease:'power4.out'},.2);tl.fromTo('#field-ko',{y:30,opacity:0},{y:0,opacity:1,duration:.4,ease:'circ.out'},.6);[...document.querySelectorAll('#field-bars i')].reverse().forEach((b,i)=>tl.to(b,{opacity:.12,duration:.15},1+i*.8));tl.fromTo('#field-progress',{scaleX:0},{scaleX:1,duration:5,ease:'none'},0);window.__timelines["field"]=tl;</script></template></body></html>
